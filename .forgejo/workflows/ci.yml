name: Release

# The Forgejo runner cannot fetch third-party actions, so this workflow keeps to
# `actions/checkout` and does everything else with shell tools. Both jobs create
# the same GitHub release on demand and upload their own asset.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_REPO: callmeteus/multideck

jobs:
  linux:
    name: linux
    runs-on: docker
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        env:
          GTI_CI_APP_ID: ${{ secrets.GTI_CI_APP_ID }}
          GTI_CI_APP_PRIVATE_KEY: ${{ secrets.GTI_CI_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends \
              curl ca-certificates jq openssl pkg-config \
              libudev-dev libxkbcommon-dev libwayland-dev libx11-dev
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          printf '%s' "$GTI_CI_APP_PRIVATE_KEY" > /tmp/app.pem
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          now=$(date +%s)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$GTI_CI_APP_ID" | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" | \
            openssl dgst -sha256 -sign /tmp/app.pem | b64url)
          jwt="$header.$payload.$signature"
          installation=$(curl -sS -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/app/installations | jq -r '.[] | select(.account.login == "callmeteus") | .id')
          token=$(curl -sS -X POST -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$installation/access_tokens" \
            | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "could not mint a GitHub App token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f /tmp/app.pem

      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release -p multideck-desktop

          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          sha="$(git rev-parse --short HEAD)"
          tag="v${version}-${sha}"

          mkdir -p pkg/multideck dist
          cp target/release/multideck pkg/multideck/
          cp README.md LICENSE pkg/multideck/
          tar -czf dist/multideck-linux-x86_64.tar.gz -C pkg multideck
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh

          body="{\"tag_name\":\"$tag\",\"name\":\"MultiDeck $tag\",\"prerelease\":true,\"generate_release_notes\":true}"
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/releases" -d "$body" || true

          release_id=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$tag" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "release $tag not found"
            exit 1
          fi

          for file in dist/*; do
            name="$(basename "$file")"
            code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$name")
            if [ "$code" = "201" ] || [ "$code" = "422" ]; then
              echo "published $name"
            else
              cat /tmp/upload.json
              exit 1
            fi
          done

  windows:
    name: windows
    runs-on: docker
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        env:
          GTI_CI_APP_ID: ${{ secrets.GTI_CI_APP_ID }}
          GTI_CI_APP_PRIVATE_KEY: ${{ secrets.GTI_CI_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends \
              curl ca-certificates jq openssl pkg-config mingw-w64 zip
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup target add x86_64-pc-windows-gnu

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          printf '%s' "$GTI_CI_APP_PRIVATE_KEY" > /tmp/app.pem
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          now=$(date +%s)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$GTI_CI_APP_ID" | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" | \
            openssl dgst -sha256 -sign /tmp/app.pem | b64url)
          jwt="$header.$payload.$signature"
          installation=$(curl -sS -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/app/installations | jq -r '.[] | select(.account.login == "callmeteus") | .id')
          token=$(curl -sS -X POST -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$installation/access_tokens" \
            | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "could not mint a GitHub App token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f /tmp/app.pem

      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release -p multideck-desktop --target x86_64-pc-windows-gnu

          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          sha="$(git rev-parse --short HEAD)"
          tag="v${version}-${sha}"

          mkdir -p pkg/multideck dist
          cp target/x86_64-pc-windows-gnu/release/multideck.exe pkg/multideck/
          cp README.md LICENSE pkg/multideck/
          (cd pkg && zip -qr ../dist/multideck-windows-x86_64.zip multideck)

          body="{\"tag_name\":\"$tag\",\"name\":\"MultiDeck $tag\",\"prerelease\":true,\"generate_release_notes\":true}"
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/releases" -d "$body" || true

          release_id=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$tag" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "release $tag not found"
            exit 1
          fi

          for file in dist/*; do
            name="$(basename "$file")"
            code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$name")
            if [ "$code" = "201" ] || [ "$code" = "422" ]; then
              echo "published $name"
            else
              cat /tmp/upload.json
              exit 1
            fi
          done
