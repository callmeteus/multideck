      <rect x="132" y="52" width="18" height="4" rx="2" fill="#5f6b7c"/>
      <rect x="132" y="62" width="26" height="4" rx="2" fill="#5f6b7c"/>
      <path d="M300 54 h22 v4 h-22 z M316 48 l8 8 -8 8" fill="none" stroke="#5f6b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
