      <rect x="106" y="24" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="188" y="24" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="270" y="24" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="352" y="24" width="48" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="24" y="106" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="106" y="106" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="188" y="106" width="70" height="70" rx="16" fill="url(#md-c-accent)" stroke="#a9c3ff"/>
      <rect x="270" y="106" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="352" y="106" width="48" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="24" y="188" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="106" y="188" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="188" y="188" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="270" y="188" width="70" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
      <rect x="352" y="188" width="48" height="70" rx="16" fill="url(#md-c-key)" stroke="#38404d"/>
