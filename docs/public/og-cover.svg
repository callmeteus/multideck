      <path d="M214 134 h18 M223 125 v18" stroke="#dce7ff" stroke-width="4" stroke-linecap="round"/>
      <rect x="48" y="212" width="22" height="22" rx="5" fill="none" stroke="#5f6b7c" stroke-width="3"/>
      <path d="M128 216 v14 h22" fill="none" stroke="#5f6b7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M212 222 a10 10 0 1 0 10 -10" fill="none" stroke="#5f6b7c" stroke-width="3" stroke-linecap="round"/>
      <rect x="286" y="212" width="34" height="4" rx="2" fill="#5f6b7c"/>
      <rect x="286" y="222" width="22" height="4" rx="2" fill="#5f6b7c"/>
