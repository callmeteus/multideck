<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 128" width="420" height="128" role="img" aria-labelledby="multideck-logo-title">
  <title id="multideck-logo-title">MultiDeck</title>
  <defs>
    <linearGradient id="md-l-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f27"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
    <linearGradient id="md-l-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272c36"/>
      <stop offset="1" stop-color="#191d25"/>
    </linearGradient>
    <linearGradient id="md-l-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa5ff"/>
      <stop offset="1" stop-color="#4a78f0"/>
    </linearGradient>
    <radialGradient id="md-l-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5c8bff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5c8bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5c8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(10 8)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#md-l-panel)"/>
    <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#3b4352" stroke-width="1.5"/>
    <circle cx="32" cy="48" r="36" fill="url(#md-l-glow)"/>
    <g stroke-width="1.2">
      <rect x="20" y="36" width="24" height="24" rx="7" fill="url(#md-l-accent)" stroke="#a9c3ff"/>
      <rect x="52" y="36" width="24" height="24" rx="7" fill="url(#md-l-key)" stroke="#38404d"/>
      <rect x="84" y="36" width="24" height="24" rx="7" fill="url(#md-l-key)" stroke="#38404d"/>
      <rect x="20" y="68" width="24" height="24" rx="7" fill="url(#md-l-key)" stroke="#38404d"/>
      <rect x="52" y="68" width="24" height="24" rx="7" fill="url(#md-l-key)" stroke="#38404d"/>
      <rect x="84" y="68" width="24" height="24" rx="7" fill="url(#md-l-key)" stroke="#38404d"/>
    </g>
    <rect x="25" y="41" width="14" height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.28"/>
  </g>

  <text x="152" y="70" fill="#edf1f6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.2">MultiDeck</text>
  <text x="153" y="100" fill="#8f98a7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.1">ONE DECK, ANY DEVICE.</text>
</svg>
